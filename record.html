<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Hanh</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="record-page">

    <main class="record">

        <a
            class="back-link"
            href="pieces.html"
            aria-label="Back to pieces"
        >
            ←
        </a>

        <section class="record-content">

            <p
                id="record-number"
                class="record-number"
            ></p>

            <h1
                id="record-title"
                class="record-title"
            ></h1>

            <div class="record-divider"></div>

            <div class="audio-container">

                <audio
                    id="audio-player"
                    controls
                    preload="metadata"
                >
                    Your browser does not support audio playback.
                </audio>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
