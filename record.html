<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>For Hanh</title>


    <style>

        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #f4f0e8;
        }


        body {
            min-height: 100vh;
            min-height: 100svh;
        }


        /* =========================
           PAGE
        ========================= */

        .record-page {

            position: relative;

            width: 100%;
            min-height: 100vh;
            min-height: 100svh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding:
                40px
                24px;

            overflow: hidden;

            background: #f4f0e8;

            color: #171614;
        }


        /* =========================
           PAPER TEXTURE
        ========================= */

        .record-page::before {

            content: "";

            position: absolute;

            inset: 0;

            background-image:
                radial-gradient(
                    rgba(0, 0, 0, 0.035) 0.7px,
                    transparent 0.7px
                );

            background-size: 5px 5px;

            opacity: 0.35;

            pointer-events: none;
        }


        /* =========================
           CONTENT
        ========================= */

        .record-content {

            position: relative;

            z-index: 1;

            width: min(100%, 430px);

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;
        }


        /* =========================
           RECORD NUMBER
        ========================= */

        .record-number {

            margin: 0 0 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 10px;

            font-weight: 400;

            letter-spacing: 0.22em;

            color: #9d978d;

            opacity: 0;

            transform: translateY(7px);

            animation:
                recordReveal
                1s
                cubic-bezier(0.22, 1, 0.36, 1)
                0.35s
                forwards;
        }


        /* =========================
           TITLE
        ========================= */

        .record-title {

            margin: 0;

            max-width: 100%;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(
                    34px,
                    9vw,
                    52px
                );

            font-weight: 400;

            line-height: 1.1;

            letter-spacing: -0.025em;

            color: #292622;

            opacity: 0;

            transform: translateY(7px);

            animation:
                recordReveal
                1.1s
                cubic-bezier(0.22, 1, 0.36, 1)
                0.75s
                forwards;
        }


        /* =========================
           DIVIDER
        ========================= */

        .record-divider {

            width: 30px;

            height: 1px;

            margin:
                30px
                0
                28px;

            background: #aaa49a;

            opacity: 0;

            transform: scaleX(0.6);

            animation:
                dividerReveal
                1s
                cubic-bezier(0.22, 1, 0.36, 1)
                1.15s
                forwards;
        }


        /* =========================
           AUDIO
        ========================= */

        .audio-wrapper {

            width: 100%;

            opacity: 0;

            transform: translateY(7px);

            animation:
                audioReveal
                1s
                cubic-bezier(0.22, 1, 0.36, 1)
                1.55s
                forwards;
        }


        audio {

            display: block;

            width: 100%;

            height: 44px;
        }


        /* =========================
           SMALL FOOTNOTE
        ========================= */

        .record-note {

            margin: 28px 0 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 9px;

            font-weight: 300;

            letter-spacing: 0.14em;

            color: #aaa49b;

            opacity: 0;

            animation:
                noteReveal
                1.1s
                cubic-bezier(0.22, 1, 0.36, 1)
                2.05s
                forwards;
        }


        /* =========================
           BACK
        ========================= */

        .back-link {

            position: absolute;

            left: 50%;

            bottom: 28px;

            transform:
                translateX(-50%);

            z-index: 2;

            color: #99938a;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 9px;

            font-weight: 400;

            letter-spacing: 0.18em;

            text-decoration: none;

            opacity: 0;

            animation:
                noteReveal
                1.1s
                cubic-bezier(0.22, 1, 0.36, 1)
                2.3s
                forwards;

            transition:
                color 0.3s ease;
        }


        .back-link:hover {
            color: #4f4b45;
        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes recordReveal {

            from {
                opacity: 0;

                transform:
                    translateY(7px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes dividerReveal {

            from {
                opacity: 0;

                transform:
                    scaleX(0.6);
            }

            to {
                opacity: 1;

                transform:
                    scaleX(1);
            }
        }


        @keyframes audioReveal {

            from {
                opacity: 0;

                transform:
                    translateY(7px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes noteReveal {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        /* =========================
           LAST RECORD
        ========================= */

        body.last-record {

            background: #0b0b0a;
        }


        body.last-record .record-page {

            background: #0b0b0a;

            color: #d8d0c0;
        }


        body.last-record .record-page::before {

            background-image:
                radial-gradient(
                    rgba(216, 208, 192, 0.10) 0.7px,
                    transparent 0.7px
                );

            background-size: 6px 6px;

            opacity: 0.22;
        }


        body.last-record .record-number {

            color: #afa17f;
        }


        body.last-record .record-title {

            color: #d8d0c0;
        }


        body.last-record .record-divider {

            background: #9b8a62;
        }


        body.last-record .record-note {

            color: #9b9488;
        }


        body.last-record .back-link {

            color: #8f8c86;
        }


        body.last-record .back-link:hover {

            color: #d8d0c0;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .record-page {

                padding:
                    35px
                    22px;
            }


            .record-number {

                margin-bottom: 18px;

                font-size: 9px;
            }


            .record-title {

                font-size:
                    clamp(
                        34px,
                        10vw,
                        48px
                    );
            }


            .record-divider {

                margin:
                    27px
                    0
                    25px;
            }


            audio {

                height: 44px;
            }


            .record-note {

                margin-top: 25px;
            }


            .back-link {

                bottom: 23px;
            }

        }


        /* =========================
           REDUCED MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            .record-number,
            .record-title,
            .record-divider,
            .audio-wrapper,
            .record-note,
            .back-link {

                opacity: 1;

                transform: none;

                animation: none;
            }

        }

    </style>

</head>


<body>


    <main class="record-page">


        <div class="record-content">


            <!-- =====================
                 NUMBER
            ====================== -->

            <p
                id="record-number"
                class="record-number"
            >
                —
            </p>


            <!-- =====================
                 TITLE
            ====================== -->

            <h1
                id="record-title"
                class="record-title"
            >
                —
            </h1>


            <!-- =====================
                 DIVIDER
            ====================== -->

            <div class="record-divider"></div>


            <!-- =====================
                 AUDIO
            ====================== -->

            <div class="audio-wrapper">

                <audio
                    id="audio-player"
                    controls
                    preload="metadata"
                >
                    Your browser does not support
                    the audio element.
                </audio>

            </div>


            <!-- =====================
                 NOTE
            ====================== -->

            <p class="record-note">
                when you're ready
            </p>


        </div>


        <!-- =====================
             BACK
        ====================== -->

        <a
            class="back-link"
            href="pieces.html"
        >
            BACK
        </a>


    </main>


    <!-- =========================
         LAST DETECTION
    ========================= -->

    <script>

        const currentParams =
            new URLSearchParams(
                window.location.search
            );

        const currentToken =
            currentParams.get("t");

        if (
            currentToken === "r3Mk8YpL"
        ) {

            document.body.classList.add(
                "last-record"
            );

        }

    </script>


    <!-- =========================
         RECORD DATA
    ========================= -->

    <script src="script.js"></script>


</body>

</html>
