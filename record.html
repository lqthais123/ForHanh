<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>For Hanh</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="record-page">

        <div class="record-container">

            <a
                href="index.html"
                class="back-button"
                aria-label="Back"
            >
                ←
            </a>

            <div class="record-content">

                <p
                    id="record-number"
                    class="record-number"
                >
                    --
                </p>

                <h1
                    id="record-title"
                    class="record-title"
                >
                    Nothing here
                </h1>

                <p class="record-description">
                    A little piece of me, for you.
                </p>

                <div class="audio-container">

                    <audio
                        id="audio-player"
                        controls
                        preload="metadata"
                    >
                        Your browser does not support audio.
                    </audio>

                </div>

            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
