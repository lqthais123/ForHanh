<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>For Hanh</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <main class="record-page">

        <div class="record">

            <p id="record-number" class="record-number">
                01
            </p>

            <h1 id="record-title">
                The Beginning
            </h1>

            <div class="player">

                <button
                    id="play-button"
                    class="play-button"
                    aria-label="Play"
                >
                    ▶
                </button>

                <div class="progress-container">

                    <div class="time-row">

                        <span id="current-time">
                            00:00
                        </span>

                        <span id="duration">
                            00:00
                        </span>

                    </div>

                    <div
                        id="progress-bar"
                        class="progress-bar"
                    >
                        <div
                            id="progress"
                            class="progress"
                        ></div>
                    </div>

                </div>

            </div>

            <p class="message">
                Take your time.
            </p>

        </div>

    </main>

    <audio id="audio"></audio>

    <script src="/script.js"></script>

</body>

</html>
